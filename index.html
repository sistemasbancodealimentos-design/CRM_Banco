<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio de Sesión | Banco de Alimentos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script type="text/javascript" src="https://gc.kes.v2.scr.kaspersky-labs.com/7EA5E9BB-55E1-4C31-9C21-4943DDFED2E4/main.js?attr=JpGslTT00y6zjsfsOv4ITElIE8h2kcFmuDNan-ijWz0U98ET1qyQNOScQocMZPXR7jeFCXjTiU8RFHiawp1bCYHUOuEeHidhNPDgoE7nMJmPfEJH39ZNnQZrR894Q4qzESHI4cNfk9I2ddZjdEhAkXLI8XsgCkEY7oGEUrtwhmt1UusvLi-a4ZgddC998GCnro-6lNoKWwbZH13uEya-lqX7IRAkjn-YTskFpWCVKDoQzA6QNqx0F_U5a2KBO1AUDhN-5Hp5zwbA4VCHLHxP__Z5RtvB8wOlkcg27AKcL7C2SdCcWUyoBVVznmFg-l1d" charset="UTF-8"></script><style>
    :root {
      --primary-orange: #f57c00;
      --primary-orange-hover: #e65100;
      --primary-green: #2e7d32;
      --dark-bg: #0f172a;
      --card-bg: rgba(15, 23, 42, 0.68);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: var(--dark-bg);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #f8fafc;
    }

    /* Aurora de fondo sutil */
    .aurora-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .aurora-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(95px);
      opacity: 0.35;
      animation: floatAurora 18s ease-in-out infinite alternate;
    }

    .blob-1 {
      width: 450px;
      height: 450px;
      background: var(--primary-orange);
      top: -10%;
      left: -5%;
    }

    .blob-2 {
      width: 500px;
      height: 500px;
      background: var(--primary-green);
      bottom: -15%;
      right: -5%;
      animation-delay: -6s;
    }

    @keyframes floatAurora {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(45px, 35px) scale(1.12); }
    }

    /* Lienzo de partículas */
    #particles-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: block;
    }

    /* Contenedor principal */
    .login-wrapper {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    /* Tarjeta Glassmorphism */
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 1.25rem;
      padding: 2.5rem 2.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .login-card:hover {
      box-shadow: 0 28px 55px -12px rgba(245, 124, 0, 0.18);
    }

    .brand-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.25rem;
      border-radius: 1rem;
      background: linear-gradient(135deg, var(--primary-orange), var(--primary-green));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px rgba(245, 124, 0, 0.3);
    }

    .brand-badge svg {
      width: 34px;
      height: 34px;
      fill: #ffffff;
    }

    .form-control {
      background-color: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      transition: all 0.25s ease;
    }

    .form-control:focus {
      background-color: rgba(30, 41, 59, 0.95);
      border-color: var(--primary-orange);
      box-shadow: 0 0 0 0.25rem rgba(245, 124, 0, 0.25);
      color: #ffffff;
    }

    .form-control::placeholder {
      color: #94a3b8;
    }

    .form-label {
      font-size: 0.875rem;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 0.4rem;
    }

    /* Botón con pulso solidario */
    .btn-login {
      background: linear-gradient(135deg, var(--primary-orange), #fb8c00);
      border: none;
      color: #ffffff;
      font-weight: 600;
      padding: 0.8rem;
      border-radius: 0.75rem;
      letter-spacing: 0.3px;
      transition: all 0.25s ease;
      animation: solidaryPulse 3s infinite;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, var(--primary-orange-hover), var(--primary-orange));
      transform: translateY(-1px);
      color: #ffffff;
    }

    @keyframes solidaryPulse {
      0% { box-shadow: 0 0 0 0 rgba(245, 124, 0, 0.45); }
      70% { box-shadow: 0 0 0 12px rgba(245, 124, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 124, 0, 0); }
    }

    /* Frase rotativa de impacto */
    .impact-ticker {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .impact-text {
      font-size: 0.82rem;
      color: #94a3b8;
      transition: opacity 0.5s ease;
    }

    .fade-out {
      opacity: 0;
    }
  </style>
</head>
<body>

  <!-- Aurora ambiental -->
  <div class="aurora-bg">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
  </div>

  <!-- Canvas de partículas e íconos solidarios -->
  <canvas id="particles-canvas"></canvas>

  <!-- Tarjeta de Inicio de Sesión -->
  <main class="login-wrapper">
    <div class="login-card" id="loginCard">
      <div class="brand-badge" title="Banco de Alimentos">
        <!-- Ícono corazón + hoja -->
        <svg viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>

      <div class="text-center mb-4">
        <h1 class="h4 fw-bold text-white mb-1">Portal Institucional</h1>
        <p class="small text-secondary mb-0">Banco de Alimentos &bull; Gestión y Logística</p>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="mb-3">
          <label for="username" class="form-label">Usuario o Correo Corporativo</label>
          <input type="text" class="form-control" id="username" placeholder="usuario@bancodealimentos.org" required />
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn btn-login w-100" id="submitBtn">
          Ingresar al Sistema
        </button>
      </form>

      <div class="impact-ticker">
        <span class="impact-text" id="impactText">Conectando solidaridad con quienes más lo necesitan.</span>
      </div>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    let shockwaves = [];
    let typingBoost = 0;

    const COLORS = ['#f57c00', '#4caf50', '#ffb74d', '#81c784'];
    const ICONS = ['heart', 'leaf', 'box'];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.65;
        this.vy = (Math.random() - 0.5) * 0.65;
        this.radius = Math.random() * 2.2 + 1.5;
        this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        this.isIcon = Math.random() < 0.22; // 22% son íconos solidarios
        this.iconType = ICONS[Math.floor(Math.random() * ICONS.length)];
        this.angle = Math.random() * Math.PI * 2;
        this.spin = (Math.random() - 0.5) * 0.01;
      }

      update() {
        const speedMultiplier = 1 + typingBoost * 1.8;
        this.x += this.vx * speedMultiplier;
        this.y += this.vy * speedMultiplier;
        this.angle += this.spin;

        // Aplicar ondas expansivas al hacer clic
        shockwaves.forEach(wave => {
          const dx = this.x - wave.x;
          const dy = this.y - wave.y;
          const dist = Math.hypot(dx, dy);
          if (Math.abs(dist - wave.radius) < 40 && dist > 0) {
            const force = (1 - Math.abs(dist - wave.radius) / 40) * 2.5;
            this.x += (dx / dist) * force;
            this.y += (dy / dist) * force;
          }
        });

        if (this.x < -20) this.x = width + 20;
        if (this.x > width + 20) this.x = -20;
        if (this.y < -20) this.y = height + 20;
        if (this.y > height + 20) this.y = -20;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = this.color;
        ctx.strokeStyle = this.color;

        if (!this.isIcon) {
          ctx.beginPath();
          ctx.arc(0, 0, this.radius + typingBoost * 1.2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.rotate(this.angle);
          ctx.globalAlpha = 0.75;
          if (this.iconType === 'heart') {
            ctx.beginPath();
            ctx.moveTo(0, 3);
            ctx.bezierCurveTo(-5, -2, -9, 2, 0, 9);
            ctx.bezierCurveTo(9, 2, 5, -2, 0, 3);
            ctx.fill();
          } else if (this.iconType === 'leaf') {
            ctx.beginPath();
            ctx.ellipse(0, 0, 6, 3, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // Caja de donación minimalista
            ctx.lineWidth = 1.4;
            ctx.strokeRect(-4.5, -4.5, 9, 9);
            ctx.beginPath();
            ctx.moveTo(-4.5, 0);
            ctx.lineTo(4.5, 0);
            ctx.stroke();
          }
        }
        ctx.restore();
      }
    }

    function initParticles() {
      const count = Math.min(Math.floor((width * height) / 14000), 85);
      particles = Array.from({ length: count }, () => new Particle());
    }
    initParticles();

    function drawConnections() {
      const maxDist = 135;
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.hypot(dx, dy);
          if (dist < maxDist) {
            const alpha = (1 - dist / maxDist) * (0.22 + typingBoost * 0.15);
            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      if (typingBoost > 0) {
        typingBoost = Math.max(0, typingBoost - 0.02);
      }

      // Actualizar ondas
      shockwaves.forEach((wave, idx) => {
        wave.radius += 9;
        wave.alpha -= 0.018;
        if (wave.alpha <= 0) {
          shockwaves.splice(idx, 1);
        } else {
          ctx.beginPath();
          ctx.arc(wave.x, wave.y, wave.radius, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(245, 124, 0, ${wave.alpha})`;
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      });

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      drawConnections();
      requestAnimationFrame(animate);
    }
    animate();

    // Efecto "Semilla" al escribir en los inputs
    document.querySelectorAll('#username, #password').forEach(input => {
      input.addEventListener('input', () => {
        typingBoost = 0.85;
      });
    });

    // Onda expansiva al enviar formulario
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const rect = document.getElementById('loginCard').getBoundingClientRect();
      shockwaves.push({
        x: rect.left + rect.width / 2,
        y: rect.top + rect.height / 2,
        radius: 20,
        alpha: 0.7
      });

      const btn = document.getElementById('submitBtn');
      const originalText = btn.textContent;
      btn.textContent = 'Verificando credenciales...';
      btn.disabled = true;

      setTimeout(() => {
        btn.textContent = originalText;
        btn.disabled = false;
      }, 1500);
    });

    // Mensajes rotativos de impacto institucional
    const impactPhrases = [
      'Conectando solidaridad con quienes más lo necesitan.',
      'Rescatando alimentos, construyendo esperanza.',
      'Cada registro impulsa nuestra red logística y social.',
      'Juntos contra el hambre y el desperdicio de alimentos.'
    ];
    let phraseIndex = 0;
    const impactEl = document.getElementById('impactText');

    setInterval(() => {
      impactEl.classList.add('fade-out');
      setTimeout(() => {
        phraseIndex = (phraseIndex + 1) % impactPhrases.length;
        impactEl.textContent = impactPhrases[phraseIndex];
        impactEl.classList.remove('fade-out');
      }, 500);
    }, 5000);
  </script>
</body>
</html>
