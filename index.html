<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco de Alimentos - ERP & Analítica FUBAM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="js/data/terceros.js"></script>
  <script src="js/data/referencias.js"></script>
  <script src="js/data/kardex-inicial.js"></script>
  <script src="js/modules/ui.js" defer></script>
  <script src="js/modules/pdf-firma.js" defer></script>
  <script src="js/modules/reportes.js" defer></script>
  <script src="js/modules/kardex.js" defer></script>
</head>
<body>
  <datalist id="lista-terceros-nit"></datalist>
  <datalist id="lista-terceros-nombre"></datalist>
  <datalist id="lista-referencias-global"></datalist>

  <div id="pantalla-login">
    <div class="login-card">
      <h2 style="font-size: 1.5rem; font-weight: bold; color: #1e3a8a; margin-bottom: 0.25rem;">Banco de Alimentos</h2>
      <p style="font-size: 0.875rem; color: #6b7280; margin-bottom: 1.5rem;">ERP & Dashboard FUBAM</p>
      <form id="form-login" style="display: flex; flex-direction: column; gap: 1rem; text-align: left;">
        <div>
          <label style="font-size: 0.75rem; font-weight: bold; color: #374151;">CORREO ELECTRÓNICO</label>
          <input type="email" id="login-email" required placeholder="usuario@bancodealimentos.org" style="width: 100%; border: 1px solid #d1d5db; padding: 0.6rem; border-radius: 0.375rem; margin-top: 0.25rem;">
        </div>
        <div>
          <label style="font-size: 0.75rem; font-weight: bold; color: #374151;">CONTRASEÑA</label>
          <input type="password" id="login-password" required placeholder="••••••••" style="width: 100%; border: 1px solid #d1d5db; padding: 0.6rem; border-radius: 0.375rem; margin-top: 0.25rem;">
        </div>
        <button type="submit" style="background-color: #2563eb; color: white; padding: 0.75rem; border-radius: 0.375rem; font-weight: bold; border: none; cursor: pointer;">Iniciar Sesión</button>
      </form>
    </div>
  </div>

  <div id="app-principal" class="hidden">
    <aside class="w-64 sidebar border-r border-gray-200 flex flex-col justify-between overflow-y-auto">
      <div class="p-4">
        <h2 class="font-bold text-blue-700 text-lg">Banco de Alimentos</h2>
        <nav class="space-y-1 text-sm text-gray-600 mt-4">
          <button onclick="mostrarSeccion('inventario')" class="nav-btn"><i class="fa-solid fa-box text-amber-600 w-5"></i><span>Inventario (Kárdex)</span></button>
          <button onclick="mostrarSeccion('reportes')" class="nav-btn"><i class="fa-solid fa-chart-line text-emerald-600 w-5"></i><span>Reportes / KPIs</span></button>
        </nav>
      </div>
      <div style="padding: 1rem;">
        <button id="btn-logout" style="width: 100%; padding: 0.4rem; background-color: #fee2e2; color: #dc2626; border-radius: 0.25rem; font-weight: bold;">Cerrar Sesión</button>
      </div>
    </aside>

    <main style="padding: 1.5rem; flex: 1;">
      <div id="seccion-inventario">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 style="font-size: 1.875rem; font-weight: bold; color: white;">Módulo de Inventario (Kárdex)</h1>
          </div>
          <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
            <div style="display: flex; align-items: center; gap: 0.4rem; background: rgba(255, 255, 255, 0.15); padding: 0.4rem 0.75rem; border-radius: 0.5rem; border: 1px solid rgba(255, 255, 255, 0.25);">
              <i class="fa-solid fa-calendar-days" style="color: white;"></i>
              <span style="color: white; font-size: 0.75rem; font-weight: bold;">Desde:</span>
              <input type="date" id="filtro-fecha-inicio" style="border: none; padding: 0.25rem; border-radius: 0.25rem; font-size: 0.8rem;">
              <span style="color: white; font-size: 0.75rem; font-weight: bold;">Hasta:</span>
              <input type="date" id="filtro-fecha-fin" style="border: none; padding: 0.25rem; border-radius: 0.25rem; font-size: 0.8rem;">
              <button onclick="consultarPorRangoFechas()" style="background-color: #f59e0b; color: white; padding: 0.3rem 0.6rem; border-radius: 0.25rem; font-weight: bold; border: none; cursor: pointer;">Consultar</button>
              <button onclick="restablecerFiltroFechas()" style="background: transparent; color: white; border: none; font-size: 0.75rem; cursor: pointer; text-decoration: underline;">Limpiar</button>
            </div>
            <button onclick="abrirModalInventario(false)" style="background-color: #22c55e; color: white; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: bold;">+ Registrar Documento</button>
          </div>
        </div>

        <div class="bg-white" style="border-radius: 0.75rem; padding: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
          <table class="table-custom" style="width: 100%;">
            <thead>
              <tr>
                <th>Doc #</th><th>Tipo Tx</th><th>NIT</th><th>Nombre Tercero</th><th>Bodega</th><th>Referencias</th><th>Cant. Total</th><th>Val. Total ($)</th><th>Fecha</th><th>Observaciones</th><th>Acción</th>
              </tr>
            </thead>
            <tbody id="tabla-inventario"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
